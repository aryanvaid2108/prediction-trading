name: reconcile

# Read-only audit: every Kalshi order (all statuses), every position, the
# account balance, and the ledger side by side. Output is the run log.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Write Kalshi private key
        run: |
          printf '%s' "${{ secrets.KALSHI_PRIVATE_KEY }}" > /tmp/kalshi.pem
          chmod 600 /tmp/kalshi.pem
      - name: Reconcile ledger vs exchange
        env:
          KALSHI_ACCESS_KEY: ${{ secrets.KALSHI_ACCESS_KEY }}
          KALSHI_PRIVATE_KEY_PATH: /tmp/kalshi.pem
        run: python -m scripts.audit_exchange
      - uses: actions/upload-artifact@v4
        with:
          name: audit-exchange
          path: .cache/audit_exchange.json
