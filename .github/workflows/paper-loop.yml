name: paper-loop

# Three intraday ticks a day. Crons are UTC; the times below are ET during
# summer (EDT). run_daily only records inside the 10:00-16:00 ET window and
# settles finished days always, so off-window fires are harmless.
on:
  # Times are off the top-of-hour on purpose: GitHub delays :00 crons most under
  # load. Delays of a few minutes are normal and fine (weather is slow); the
  # 10:00-16:00 ET window guard absorbs them.
  schedule:
    - cron: "30 14 * * *"   # ~10:30 ET  first in-window read
    - cron: "10 17 * * *"   # ~13:10 ET  tightening
    - cron: "40 18 * * *"   # ~14:40 ET  sharpest, near the edge peak
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: write            # so the job can commit the ledger back

concurrency:
  group: paper-loop
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Settle + record tick
        run: python -m scripts.run_daily   # defaults to the active station list

      - name: Update dashboard
        run: python -m scripts.dashboard   # writes DASHBOARD.md + the Actions run summary

      - name: Commit only when the ledger actually changed
        run: |
          git config user.name "kalshi-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cache/paper_ledger.json
          if git diff --cached --quiet; then
            echo "no ledger change this tick — not committing"
          else
            git add DASHBOARD.md            # refresh the dashboard alongside a real change
            git commit -m "paper tick $(date -u +'%F %H:%MZ')"
            git push
          fi

      - name: Notify phone (ntfy)
        if: always()          # also pings on failure
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret not set — skipping notification"
            exit 0
          fi
          MSG="$(python -m scripts.notify 2>/dev/null || echo 'tick ran')"
          curl -s \
            -H "Title: paper-loop ${{ job.status }}" \
            -H "Tags: chart_with_upwards_trend" \
            -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
