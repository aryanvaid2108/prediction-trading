name: paper-loop

# Paper strategy arms (wx.strategies.ARMS): every tick each arm picks its own
# thesis from ONE shared quote, filled at the live book's touch and depth-capped.
# Same tick slots as live-loop (15Z / 17Z / 19Z, 75 min); the cron over-fires and
# a cheap pre-check skips runs that GitHub delays past a slot.
on:
  schedule:
    - cron: "*/15 11-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Set to 1 to record a tick outside a slot (still inside 10-16 ET)"
        default: ""

permissions:
  contents: write            # so the job can commit the ledgers back

concurrency:
  group: paper-loop
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Tick-slot pre-check
        id: slot
        run: |
          M=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
          SLOT=""
          for S in 15 17 19; do
            if [ "$M" -ge $((S * 60)) ] && [ "$M" -lt $((S * 60 + 75)) ]; then SLOT="$S"; fi
          done
          if [ -n "${{ inputs.force }}" ]; then SLOT="manual"; fi
          echo "now $(date -u +%H:%M)Z -> slot='${SLOT}'"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.slot.outputs.slot != ''
      - uses: actions/setup-python@v5
        if: steps.slot.outputs.slot != ''
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.slot.outputs.slot != ''
        run: pip install -r requirements.txt

      - name: Settle + record tick (all arms)
        if: steps.slot.outputs.slot != ''
        env:
          PAPER_FORCE: ${{ inputs.force }}
        run: python -m scripts.run_daily

      - name: Update dashboard
        if: steps.slot.outputs.slot != ''
        run: python -m scripts.dashboard

      - name: Commit only when a ledger actually changed
        if: steps.slot.outputs.slot != ''
        run: |
          git config user.name "kalshi-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cache/paper_*.json
          if git diff --cached --quiet; then
            echo "no ledger change this tick — not committing"
          else
            git add DASHBOARD.md
            git commit -m "paper tick $(date -u +'%F %H:%MZ')"
            git pull --rebase origin main
            git push
          fi

      - name: Notify phone (ntfy)
        if: always() && steps.slot.outputs.slot != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret not set — skipping notification"
            exit 0
          fi
          MSG="$(python -m scripts.notify 2>/dev/null || echo 'tick ran')"
          curl -s \
            -H "Title: paper arms ${{ job.status }}" \
            -H "Tags: chart_with_upwards_trend" \
            -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
