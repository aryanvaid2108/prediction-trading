name: live-loop

# AUTONOMOUS REAL-MONEY TRADING. Three intraday ticks a day: each re-quotes with
# fresher observations and adds any NEW edge the sharper forecast reveals. Safe to
# fire repeatedly: run_live is idempotent (won't re-buy a held bucket) and capped
# ($750 total / 25% per station per day), so later ticks are purely additive within
# budget. Refuses to place outside the 10:00-16:00 ET window.
#
# Kill switch: disable this workflow in the Actions tab (top-right "..." > Disable).
on:
  schedule:
    - cron: "30 14 * * *"   # ~10:30 ET / 8:00pm IST  — morning, biggest edge
    - cron: "10 17 * * *"   # ~13:10 ET / 10:40pm IST — tightening
    - cron: "40 18 * * *"   # ~14:40 ET / 12:10am IST — sharpest, near edge peak
  workflow_dispatch: {}

permissions:
  contents: write            # commit live_ledger.json

concurrency:
  group: live                # never overlap a manual live.yml run
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Kalshi private key
        run: |
          printf '%s' "${{ secrets.KALSHI_PRIVATE_KEY }}" > /tmp/kalshi.pem
          chmod 600 /tmp/kalshi.pem

      - name: Place live orders
        env:
          KALSHI_ACCESS_KEY: ${{ secrets.KALSHI_ACCESS_KEY }}
          KALSHI_PRIVATE_KEY_PATH: /tmp/kalshi.pem
          LIVE: "1"
        run: python -m scripts.run_live

      - name: Commit live ledger if it changed
        run: |
          git config user.name "kalshi-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cache/live_ledger.json
          if git diff --cached --quiet; then
            echo "no live orders placed this run"
          else
            git commit -m "live orders $(date -u +'%F %H:%MZ')"
            git push
          fi

      - name: Notify phone (ntfy)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "no NTFY_TOPIC — skipping"; exit 0; fi
          if [ "${{ job.status }}" != "success" ]; then
            MSG="❌ live-loop ${{ job.status }} — check the Actions log."
          else
            MSG="$(cat .cache/live_notify.txt 2>/dev/null || echo 'live-loop ran (no summary).')"
          fi
          curl -s \
            -H "Title: Kalshi live-loop" \
            -H "Tags: money_with_wings" \
            -H "Click: https://aryanvaid2108.github.io/prediction-trading/" \
            -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
