name: live-loop

# AUTONOMOUS REAL-MONEY TRADING. Fires once a day at the morning tick (sharpest
# edge) and places the model's live orders. Safe to fire repeatedly: run_live is
# idempotent (won't re-buy a held bucket) and capped ($750 total / 25% per station
# per day), and it refuses to place outside the 10:00-16:00 ET window.
#
# Kill switch: disable this workflow in the Actions tab (top-right "..." > Disable).
on:
  schedule:
    - cron: "30 14 * * *"   # ~10:30 ET / 8:00pm IST — morning tick
  workflow_dispatch: {}

permissions:
  contents: write            # commit live_ledger.json

concurrency:
  group: live                # never overlap a manual live.yml run
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Kalshi private key
        run: |
          printf '%s' "${{ secrets.KALSHI_PRIVATE_KEY }}" > /tmp/kalshi.pem
          chmod 600 /tmp/kalshi.pem

      - name: Place live orders
        env:
          KALSHI_ACCESS_KEY: ${{ secrets.KALSHI_ACCESS_KEY }}
          KALSHI_PRIVATE_KEY_PATH: /tmp/kalshi.pem
          LIVE: "1"
        run: python -m scripts.run_live

      - name: Commit live ledger if it changed
        run: |
          git config user.name "kalshi-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cache/live_ledger.json
          if git diff --cached --quiet; then
            echo "no live orders placed this run"
          else
            git commit -m "live orders $(date -u +'%F %H:%MZ')"
            git push
          fi

      - name: Notify phone (ntfy)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "no NTFY_TOPIC — skipping"; exit 0; fi
          curl -s -H "Title: live-loop ${{ job.status }}" -H "Tags: money_with_wings" \
            -d "Live trading run finished (${{ job.status }})." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
