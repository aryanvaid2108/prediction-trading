name: pnl

# Daily realized-P&L report. Runs after overnight settlement and pushes the exact
# net (fills vs settled results) to your phone. Read-only — never trades.
on:
  schedule:
    - cron: "0 13 * * *"   # ~9am ET, after the CLI reports publish and markets settle
  workflow_dispatch:
    inputs:
      day:
        description: "day to report (YYYY-MM-DD; blank = yesterday ET)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Write Kalshi private key
        run: |
          printf '%s' "${{ secrets.KALSHI_PRIVATE_KEY }}" > /tmp/kalshi.pem
          chmod 600 /tmp/kalshi.pem
      - name: Compute daily P&L
        env:
          KALSHI_ACCESS_KEY: ${{ secrets.KALSHI_ACCESS_KEY }}
          KALSHI_PRIVATE_KEY_PATH: /tmp/kalshi.pem
        run: python -m scripts.daily_pnl ${{ inputs.day }}
      - name: Notify phone (ntfy)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "no NTFY_TOPIC — skipping"; exit 0; fi
          MSG="$(cat .cache/pnl_notify.txt 2>/dev/null || echo 'daily P&L ran (no summary).')"
          curl -s \
            -H "Title: Kalshi daily P&L" \
            -H "Tags: bar_chart" \
            -H "Click: https://aryanvaid2108.github.io/prediction-trading/" \
            -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
